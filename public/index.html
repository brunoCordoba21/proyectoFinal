<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesca Las Termas - Panel de Control</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="main-navbar" style="display: none;">
    <div class="brand">
      <h2><i class="fa-solid fa-water"></i> Pesca Las Termas</h2>
    </div>
    <div id="user-status-bar" style="display: flex; align-items: center; gap: 15px;"></div>
  </nav>

  <!-- LOGIN -->
  <section id="sec-login" class="container" style="display: block;">
    <div class="card" style="max-width: 420px; margin: 60px auto;">
      <div style="text-align: center; margin-bottom: 25px;">
        <h2 style="color: var(--primary); margin-bottom: 5px;"><i class="fa-solid fa-fish-fins"></i> Iniciar Sesión</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Accedé a tu panel exclusivo</p>
      </div>
      <form id="form-login">
        <div style="margin-bottom: 15px;">
          <label>Correo Electrónico</label>
          <input type="email" id="login-email" required placeholder="tucorreo@ejemplo.com">
        </div>
        <div style="margin-bottom: 20px;">
          <label>Contraseña</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
      </form>
      <div id="login-msg" style="margin-top: 15px; font-weight: 500; text-align: center; font-size: 0.9rem;"></div>
    </div>
  </section>

  <!-- PANEL PRINCIPAL ADMIN -->
  <section id="sec-dashboard" class="container" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 style="font-size: 1.8rem; margin-bottom: 5px;">Panel de Administración 📊</h1>
        <p style="color: var(--text-muted);">Gestión completa de guías y usuarios del sistema.</p>
      </div>
      <button class="btn" onclick="abrirModalGuia()"><i class="fa-solid fa-user-plus"></i> Nuevo Guía</button>
    </div>

    <!-- Gestión de Guías -->
    <div class="card">
      <h3 style="margin-top: 0; margin-bottom: 15px;">Guías Registrados</h3>
      <div id="grid-guias" class="grid-guias"></div>
    </div>

    <!-- Gestión de Usuarios -->
    <div class="card" style="margin-top: 30px;">
      <h3 style="margin-top: 0; margin-bottom: 15px;">Usuarios del Sistema</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Registro</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- MODAL CREAR/EDITAR GUÍA -->
  <div id="modal-guia" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modal-guia-titulo" style="margin-top: 0; margin-bottom: 20px;"><i class="fa-solid fa-user-plus"></i> Registrar Guía</h3>
      <form id="form-guia">
        <input type="hidden" id="guia-id">
        <div class="form-grid" style="margin-bottom: 15px;">
          <div>
            <label>Nombre Completo</label>
            <input type="text" id="guia-nombre" required placeholder="Ej: Juan Pérez">
          </div>
          <div>
            <label>Correo Electrónico</label>
            <input type="email" id="guia-email" required placeholder="guia@pesca.com">
          </div>
          <div>
            <label>Contraseña</label>
            <input type="password" id="guia-password" placeholder="••••••••">
          </div>
          <div>
            <label>Teléfono</label>
            <input type="text" id="guia-telefono" placeholder="3815000000">
          </div>
          <div>
            <label>Embarcación</label>
            <input type="text" id="guia-embarcacion" placeholder="Tracker 16m">
          </div>
          <div>
            <label>Modalidades</label>
            <input type="text" id="guia-modalidades" placeholder="Spinning, Baitcasting">
          </div>
        </div>
        <div style="margin-bottom: 25px;">
          <label>Precio Base por Jornada ($)</label>
          <input type="number" id="guia-precio" required placeholder="120000">
        </div>
        <div style="display: flex; gap: 12px;">
          <button type="submit" class="btn" style="flex: 1;">Guardar Guía</button>
          <button type="button" class="btn btn-danger" style="flex: 1;" onclick="cerrarModalGuia()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/guias.js"></script>
</body>
</html>
