<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva de Guías de Pesca - Las Termas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <h1>Panel de Administración - Pesca Las Termas</h1>

    <!-- Pestañas de Navegación -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="cambiarPestana('guiasTab', this)">Gestión de Guías</button>
      <button class="tab-btn" onclick="cambiarPestana('reservasTab', this)">Gestión de Reservas</button>
    </div>

    <!-- SECCIÓN 1: GUÍAS -->
    <div id="guiasTab" class="tab-content active">
      <form id="formGuia">
        <h2 id="formTitulo" class="full-width">Registrar Nuevo Guía</h2>
        <input type="hidden" id="guiaId">

        <div>
          <label for="nombre">Nombre Completo</label>
          <input type="text" id="nombre" required>
        </div>

        <div>
          <label for="telefono">Teléfono de Contacto</label>
          <input type="text" id="telefono" required>
        </div>

        <div>
          <label for="modalidades">Modalidades de Pesca</label>
          <input type="text" id="modalidades" placeholder="Ej: Carnada, Fly Fishing" required>
        </div>

        <div>
          <label for="embarcacion">Embarcación / Lancha</label>
          <input type="text" id="embarcacion" required>
        </div>

        <div class="full-width">
          <label for="servicios">Servicios Incluidos</label>
          <input type="text" id="servicios" placeholder="Ej: Carnada viva, refrigerios, licencias">
        </div>

        <div>
          <label for="precioBase">Precio Base ($)</label>
          <input type="number" id="precioBase" required>
        </div>

        <div>
          <label for="precioFull">Precio Servicio Full ($)</label>
          <input type="number" id="precioFull">
        </div>

        <div>
          <label for="capacidadMax">Capacidad Máxima (Personas)</label>
          <input type="number" id="capacidadMax" value="3" required>
        </div>

        <button type="submit" id="btnGuardar" class="btn btn-submit full-width">Guardar Guía</button>
        <button type="button" id="btnCancelar" class="btn btn-cancel full-width" onclick="cancelarEdicion()">Cancelar Edición</button>
      </form>

      <h2>Guías Disponibles</h2>
      <div id="listaGuias" class="card-grid">Cargando guías...</div>
    </div>

    <!-- SECCIÓN 2: RESERVAS -->
    <div id="reservasTab" class="tab-content">
      <form id="formReserva">
        <h2 class="full-width">Agendar Nueva Reserva</h2>

        <div>
          <label for="clienteNombre">Nombre del Cliente</label>
          <input type="text" id="clienteNombre" required>
        </div>

        <div>
          <label for="clienteTelefono">Teléfono del Cliente</label>
          <input type="text" id="clienteTelefono" required>
        </div>

        <div class="full-width">
          <label for="guiaSelect">Seleccionar Guía de Pesca</label>
          <select id="guiaSelect" required>
            <option value="">Cargando guías...</option>
          </select>
        </div>

        <div>
          <label for="fechaExcursion">Fecha de Excursión</label>
          <input type="date" id="fechaExcursion" required>
        </div>

        <div>
          <label for="cantPersonas">Cantidad de Pesca/Pasajeros</label>
          <input type="number" id="cantPersonas" value="2" min="1" required>
        </div>

        <div class="full-width">
          <label for="tipoServicio">Tipo de Servicio</label>
          <select id="tipoServicio" required>
            <option value="BASE">Servicio Base</option>
            <option value="FULL">Servicio Full (Con todo incluido)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-submit full-width">Agendar Reserva</button>
      </form>

      <h2>Reservas Agendadas</h2>
      <div id="listaReservas" class="card-grid">Cargando reservas...</div>
    </div>

  </div>

  <!-- Cambio de Pestañas -->
  <script>
    function cambiarPestana(tabId, elemento) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      elemento.classList.add('active');

      if (tabId === 'reservasTab') {
        cargarSelectGuias();
      }
    }
  </script>

  <!-- Scripts JS de cada Módulo -->
  <script src="js/guias.js"></script>
  <script src="js/reservas.js"></script>
</body>
</html>
